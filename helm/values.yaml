fullnameOverride: ""

global:
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  env: []
  envFromSecret: ""

  image:
    repository: jrunner-api
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""
    host: ""
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  resources: {}

  worker:
    image:
      repository: jrunner-worker
      tag: latest
    resources: {}