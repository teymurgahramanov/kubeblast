nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "100m"
    memory: "512Mi"

# Additional application environment variables. Use envFromSecret for secrets.
env: []
envFromSecret: ""

mongodb:
  enabled: true
  architecture: "standalone"
  useStatefulSet: true
  auth:
    enabled: true
    rootPassword: ""
    usernames:
      - "kubeblast"
    passwords:
      - "kubeblast"
    databases:
      - "kubeblast"
    existingSecret: ""
  image:
    digest: "sha256:6b25f1600ac5576d7ee45c0c76bc28dbb28a61ded80ebf75baaa226a431fe57d"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  resourcesPreset: "none"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    size: "2Gi"
    accessModes:
      - "ReadWriteOnce"
    storageClass: ""
    annotations: {}
    labels: {}
  extraVolumes: []
  extraVolumeMounts: []

influxdb:
  enabled: true
  image:
    repository: "influxdb"
    # Use Debian-based InfluxDB 1.8.10 because the subchart's Alpine image has no ARM64 manifest.
    tag: "1.8.10@sha256:299ebda2c7e308dbef42e26ac9b8fd1d9b3bcb8a0aee80c6509aa0219c1d0290"
    pullPolicy: "IfNotPresent"
  initScripts:
    enabled: true
    scripts:
      init.iql: |+
        CREATE DATABASE "jmeter" WITH DURATION 30d REPLICATION 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  config:
    http:
      enabled: true
      flux-enabled: true

pvc:
  existingClaim: ""
  storageClassName: ""
  size: "2Gi"
  accessMode: "ReadWriteMany"
  annotations: {}
  labels: {}

podAnnotations: {}
podLabels: {}
extraVolumes: []
extraVolumeMounts: []

image:
  repository: teymurgahramanov/kubeblast
  tag: ""
imagePullSecrets: []
imagePullPolicy: IfNotPresent

containerPort:
  web: 8080
  api: 8000

service:
  port:
    web: 80
    api: 8000

serviceAccount:
  annotations: {}

ingress:
  enabled: false
  annotations: {}
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""
    host: ""
