# Kubeblast Helm chart values

# Name override for the release
nameOverride: ""

# Full name override for the release
fullnameOverride: ""

# Pod security context configuration for Kubeblast pod.
podSecurityContext: {}

# Node selector for Kubeblast pod scheduling.
nodeSelector: {}

# Tolerations for Kubeblast pod scheduling
tolerations: []

# Affinity rules for Kubeblast pod scheduling
affinity: {}

# Resources configuration for Kubeblast container
resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "100m"
    memory: "512Mi"

# Environment variables for Kubeblast container. Refer to README.md for more details.
# Use envFromSecret to load environment variables from a secret.
env: []

# Environment variables from secret. Refer to README.md for more details.
envFromSecret: ""

# MongoDB configuration
# If you want to use external MongoDB, set "enabled" to false and configure env variables.
mongodb:
  enabled: true
  instanceName: "kubeblast-mongodb"
  username: "kubeblast"
  password: "kubeblast"
  database: "kubeblast"
  imagePullPolicy: "IfNotPresent"
  imagePullSecrets: []
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    size: "2Gi"
    accessMode: "ReadWriteOnce"
    storageClassName: ""
    annotations: {}
    labels: {}
  extraVolumes: []
  extraVolumeMounts: []

# InfluxDB configuration (JMeter real-time metrics)
# Uses the official influxdata/influxdb Helm chart.
# If disabled, real-time metrics features are not available.
influxdb:
  enabled: false
  initScripts:
    enabled: true
    scripts:
      init.iql: |+
        CREATE DATABASE "jmeter" WITH DURATION 30d REPLICATION 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  config:
    http:
      enabled: true
      flux-enabled: true

# Storage PVC configuration
pvc:
  # If you want to use an existing PVC, set existingClaim to the PVC name
  # When existingClaim is set, a new PVC will not be created
  existingClaim: ""
  # PVC creation settings (used only if existingClaim is empty)
  storageClassName: ""
  size: "2Gi"
  accessMode: "ReadWriteMany"
  annotations: {}
  labels: {}

# Additional annotations for Kubeblast pod
podAnnotations: {}

# Additional labels for Kubeblast pod
podLabels: {}

# Extra volumes to add to the Kubeblast pod
extraVolumes: []

# Extra volume mounts to add to the Kubeblast container
extraVolumeMounts: []

# Kubeblast container image configuration
image:
  repository: teymurgahramanov/kubeblast
  tag: ""
imagePullSecrets: []
imagePullPolicy: IfNotPresent

# Kubeblast service configuration
service:
  port:
    web: 80    # Web interface port
    api: 8000  # API port

# Kubeblast service account annotations
serviceAccount:
  annotations: {}

# Kubeblast Ingress configuration
ingress:
  enabled: false
  annotations: {}
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""
    host: ""
