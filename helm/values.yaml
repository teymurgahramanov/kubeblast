fullnameOverride: ""

global:
  imagePullSecrets: []
  env: []
  envFromSecret: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  image:
    repository: jrunner-api
    pullPolicy: IfNotPresent
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""
    host: ""
  resources: {}

worker:
  image:
    repository: jrunner-worker
    pullPolicy: IfNotPresent
    tag: latest

  securityContext: {}

  resources: {}