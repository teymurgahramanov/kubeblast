apiVersion: v2
name: kubeblast
description: A Helm chart for Kubernetes
type: application
version: "1.3.0"
appVersion: "1.3.0"
dependencies:
  - name: mongodb
    version: "19.1.22"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: mongodb.enabled
  - name: influxdb
    version: "4.12.5"
    repository: "https://helm.influxdata.com/"
    condition: influxdb.enabled