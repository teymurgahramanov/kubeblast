apiVersion: v1
kind: Service
metadata:
  name: {{ include "jrunner.fullname" . }}
  labels:
    {{- include "jrunner.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    {{- include "jrunner.selectorLabels" . | nindent 4 }}