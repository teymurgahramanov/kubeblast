apiVersion: v1
kind: Service
metadata:
  name: {{ include "jrunner.fullname" . }}
  labels:
    {{- include "jrunner.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port.web }}
      targetPort: web
      protocol: TCP
      name: web
    - port: {{ .Values.service.port.api }}
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "jrunner.selectorLabels" . | nindent 4 }}