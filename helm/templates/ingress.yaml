{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jrunner.fullname" . }}
  labels:
    {{- include "jrunner.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "jrunner.fullname" . }}
                port:
                  number: {{ .Values.service.port.api }}
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "jrunner.fullname" . }}
                port:
                  number: {{ .Values.service.port.web }}
{{- end }}
