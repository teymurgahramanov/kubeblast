---
apiVersion: skaffold/v3
kind: Config
metadata:
  name: kubeblast

build:
  artifacts:
    - image: kubeblast
      context: ./
      docker:
        dockerfile: Dockerfile
        buildArgs:
          EDITION_IS_PRO: "true"

deploy:
  helm:
    releases:
      - name: kubeblast
        namespace: kubeblast
        createNamespace: true
        chartPath: ./helm
        setValueTemplates:
          image.repository: "{{ .IMAGE_REPO_kubeblast }}"
          image.tag: "{{ .IMAGE_TAG_kubeblast }}"
          ingress.enabled: true
          ingress.host: "kubeblast.local"
          ingress.className: "nginx"
          env:
            - name: PRO_LICENSE_KEY
              value: F6D4E8-7F5D6F-49BEBF-1DF116-20DA8C-V3
            - name: PRO_LICENSE_ID
              value: b07409b5-9f0f-4c3d-837e-5844276f4aa5
          #  - name: LOG_LEVEL
          #    value: "ERROR"
          #  - name: MONGO_HOST
            #  value: "mongodb.infra"
            #- name: MONGO_PORT
            #  value: "27017"
            #- name: MONGO_DB_NAME
            #  value: "kubeblast"
            #- name: MONGO_DB_USER
            #  value: "kubeblast"
            #- name: MONGO_DB_PASS
            #  value: "kubeblast"
            #- name: S3_URL
            #  value: "http://minio.infra:9000"
            - name: S3_ACCESS_KEY
              value: "AKIAWG74R6ROYZL77I3U"
              #value: "FBUuscAKjIhPoEHnkL1H"
            - name: S3_SECRET_KEY
              value: "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"
              #value: "Ym5F5ofXIr98xlO4N5NzhkyyfrdUEmONXedkrNSq"
            - name: S3_BUCKET
              value: "kubeblast-test"
            - name: S3_REGION
              value: "eu-west-1"
            - name: LDAP_ENABLED
              value: "true"
            - name: LDAP_SERVER
              value: "ldap://ldap.cbar.az"
            - name: LDAP_BASE_DN
              value: OU=Administration\,DC=cbar\,DC=az
            - name: LDAP_BIND_DN
              value: CN=Grafana Ldap\,OU=Administration\,DC=cbar\,DC=az
            - name: LDAP_BIND_PASSWORD
              value: "Gr@fAn@2#24"
            - name: LDAP_USER_SEARCH_FILTER
              value: "(&(objectClass=person)(sAMAccountName={username}))"
            - name: LDAP_GROUP_SEARCH_FILTER
              value: "(&(objectClass=group)(member={dn}))"              
portForward:
  - resourceType: deployment
    resourceName: kubeblast
    namespace: kubeblast
    port: 80
    localPort: 9001
  - resourceType: deployment
    resourceName: kubeblast
    namespace: kubeblast
    port: 8000
    localPort: 9002

profiles:
  - name: docker-desktop
    activation:
      - kubeContext: docker-desktop
