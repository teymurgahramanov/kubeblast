---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: jrunner

build:
  artifacts:
  - image: jrunner-api
    context: ./api
    docker:
      dockerfile: Dockerfile
  - image: jrunner-worker
    context: ./worker
    docker:
      dockerfile: Dockerfile

deploy:
  helm:
    releases:
    - name: jrunner
      namespace: jrunner
      createNamespace: true
      chartPath: ./
      valuesFiles:
        - values.yaml
      setValues:
        api.image: jrunner-api
        worker.image: jrunner-worker
        api.env[0].name: MONGO_HOST
        api.env[0].value: "mongodb"
        api.env[1].name: MONGO_PORT
        api.env[1].value: "27017"
        api.env[2].name: MONGO_DB_NAME
        api.env[2].value: "jrunner"
        api.env[3].name: MONGO_DB_USER
        api.env[3].value: "myuser"
        api.env[4].name: MONGO_DB_PASS
        api.env[4].value: "mypassword"
        api.env[5].name: S3_URL
        api.env[5].value: "https://s3.cbar.az"
        api.env[6].name: S3_ACCESS_KEY
        api.env[6].value: "sWN8vFdS4sXloyDXApdO"
        api.env[7].name: S3_SECRET_KEY
        api.env[7].value: "cHat4VLoAebDW8wCMWAMlP5vMFXSxNOFmYtDBgLD"
        api.env[8].name: S3_BUCKET
        api.env[8].value: "jrunner"

    - name: mongodb
      namespace: jrunner
      createNamespace: true
      repo: https://charts.bitnami.com/bitnami
      remoteChart: mongodb
      setValues:
        auth.enabled: true
        auth.rootPassword: changeme
        auth.username: root
        auth.password: changeme
        auth.database: ryze

        persistence.enabled: true
        persistence.size: 8Gi

        replicaSet.enabled: false

    - name: minio
      namespace: jrunner
      createNamespace: true
      repo: https://charts.bitnami.com/bitnami
      remoteChart: minio
      setValues:
        auth.rootUser: minioadmin
        auth.rootPassword: minioadmin
        defaultBuckets: "my-bucket"

portForward:
- resourceType: deployment
  resourceName: jrunner-api
  namespace: default
  port: 8000
  localPort: 8000

profiles:
  - name: docker-desktop
    activation:
      - kubeContext: docker-desktop
        command: dev
