---
apiVersion: skaffold/v3
kind: Config
metadata:
  name: kubeblast

build:
  artifacts:
    - image: kubeblast
      context: ./
      docker:
        dockerfile: Dockerfile
        buildArgs:
          EDITION_IS_PRO: "true"

deploy:
  helm:
    releases:
      - name: kubeblast
        namespace: kubeblast
        createNamespace: true
        chartPath: ./helm
        setValueTemplates:
          image.repository: "{{ .IMAGE_REPO_kubeblast }}"
          image.tag: "{{ .IMAGE_TAG_kubeblast }}"
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: MONGO_HOST
              value: "mongodb.infra"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DB_NAME
              value: "kubeblast"
            - name: MONGO_DB_USER
              value: "kubeblast"
            - name: MONGO_DB_PASS
              value: "kubeblast"
            - name: S3_URL
              value: "http://minio.infra:9000"
            - name: S3_ACCESS_KEY
              #value: "FBUuscAKjIhPoEHnkL1H" # Home
              value: "1MtdMlZehiTTeVqayB2T" # Office 
            - name: S3_SECRET_KEY
              #value: "Ym5F5ofXIr98xlO4N5NzhkyyfrdUEmONXedkrNSq" # Home
              value: "1ELXLxJc6BMPSgdlC7d0F1ASXNIcOZO3zZa6hEYy" # Office
            - name: S3_BUCKET
              value: "kubeblast"
            - name: K8S_NAMESPACE
              value: "kubeblast"
          ingress.enabled: true
          ingress.host: "kubeblast.local"
          ingress.className: "nginx"

portForward:
  - resourceType: deployment
    resourceName: kubeblast
    namespace: kubeblast
    port: 80
    localPort: 9001
  - resourceType: deployment
    resourceName: kubeblast
    namespace: kubeblast
    port: 8000
    localPort: 9002

profiles:
  - name: docker-desktop
    activation:
      - kubeContext: docker-desktop
