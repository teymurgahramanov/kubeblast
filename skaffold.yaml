---
apiVersion: skaffold/v3
kind: Config
metadata:
  name: jrunner

build:
  artifacts:
    - image: jrunner
      context: ./
      docker:
        dockerfile: Dockerfile

deploy:
  helm:
    releases:
      - name: jrunner
        namespace: jrunner
        createNamespace: true
        chartPath: ./helm
        setValueTemplates:
          image.repository: "{{ .IMAGE_REPO_jrunner }}"
          image.tag: "{{ .IMAGE_TAG_jrunner }}"
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: MONGO_HOST
              value: "mongodb.infra"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DB_NAME
              value: "jrunner"
            - name: MONGO_DB_USER
              value: "jrunner"
            - name: MONGO_DB_PASS
              value: "jrunner"
            - name: S3_URL
              value: "http://minio.infra:9000"
            - name: S3_ACCESS_KEY
              value: "FBUuscAKjIhPoEHnkL1H" # Home
              #value: "1MtdMlZehiTTeVqayB2T" # Office 
            - name: S3_SECRET_KEY
              value: "Ym5F5ofXIr98xlO4N5NzhkyyfrdUEmONXedkrNSq" # Home
              #value: "1ELXLxJc6BMPSgdlC7d0F1ASXNIcOZO3zZa6hEYy" # Office
            - name: S3_BUCKET
              value: "jrunner"
            - name: K8S_NAMESPACE
              value: "jrunner"
          ingress.enabled: true
          ingress.host: "jrunner.local"
          ingress.className: "nginx"

portForward:
  - resourceType: deployment
    resourceName: jrunner
    namespace: jrunner
    port: 80
    localPort: 9001
  - resourceType: deployment
    resourceName: jrunner
    namespace: jrunner
    port: 8000
    localPort: 9002

profiles:
  - name: docker-desktop
    activation:
      - kubeContext: docker-desktop
