apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: jrunner
build:
  artifacts:
  - image: jrunner-api
    context: ./api
    docker:
      dockerfile: Dockerfile
manifests:
  rawYaml:
    - .dev/deployment.yaml
    - .dev/serviceaccount.yaml
portForward:
- resourceType: deployment
  resourceName: jrunner-api
  namespace: default
  port: 8000
  localPort: 8000
profiles:
  - name: docker-desktop
    activation:
      - kubeContext: docker-desktop
        command: dev