apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: jmeter-k8s-api
build:
  artifacts:
  - image: jmeter-api
    context: .
    docker:
      dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/*.yaml
portForward:
- resourceType: deployment
  resourceName: jmeter-api
  namespace: default
  port: 8000
  localPort: 8000