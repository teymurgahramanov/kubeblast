apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: jrunner
build:
  artifacts:
  - image: jrunner
    context: .
    docker:
      dockerfile: Dockerfile
manifests:
  rawYaml:
    - .dev/*.yaml
portForward:
- resourceType: deployment
  resourceName: jrunner
  namespace: default
  port: 8000
  localPort: 8000
profiles:
  - name: docker-desktop
    activation:
      - kubeContext: docker-desktop
        command: dev