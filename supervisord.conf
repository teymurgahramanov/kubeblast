[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=critical
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=nginx -e /dev/null -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
process_name=%(program_name)s

[program:api]
command=python main.py
directory=/app/api
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
process_name=%(program_name)s
