server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires -1;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~* \.(?:ico|woff2?|eot|ttf|otf|svg)$ {
        access_log off;
        add_header Cache-Control "public";
    }
}
